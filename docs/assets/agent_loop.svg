<svg xmlns="http://www.w3.org/2000/svg" width="800" height="700" viewBox="0 0 800 700">
<defs><style>.h{font:700 24px Arial;fill:#16324F}.t{font:700 20px Arial;fill:#fff}.s{font:16px Arial;fill:#16324F}.arrow{stroke:#5B7083;stroke-width:4;fill:none;marker-end:url(#a)}</style><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#5B7083"/></marker></defs>

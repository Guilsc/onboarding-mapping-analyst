<circle cx="400" cy="120" r="72" fill="#2F75B5"/><text x="400" y="128" text-anchor="middle" class="t">OBSERVE</text>
<circle cx="625" cy="265" r="72" fill="#5B9BD5"/><text x="625" y="273" text-anchor="middle" class="t">REASON</text>
<circle cx="540" cy="525" r="72" fill="#70AD47"/><text x="540" y="533" text-anchor="middle" class="t">ACT</text>
<circle cx="260" cy="525" r="72" fill="#ED7D31"/><text x="260" y="533" text-anchor="middle" class="t">VALIDATE</text>
<circle cx="175" cy="265" r="72" fill="#A5A5A5"/><text x="175" y="273" text-anchor="middle" class="t">LEARN</text>

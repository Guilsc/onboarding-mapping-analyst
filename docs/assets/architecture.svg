<?xml version="1.0" ?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="590" viewBox="0 0 960 590" role="img" aria-labelledby="mapping-title mapping-desc">
  <title id="mapping-title">Evidence becomes canonical only after review</title>
  <desc id="mapping-desc">Authorized Salesforce and Workfront evidence supports a draft mapping. Human review either requests changes or approves the mapping. Only approved material becomes canonical. Real customer data and outputs stay in the private workspace; repository examples are synthetic.</desc>
  <defs>
    <marker id="mapping-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8Z" fill="#bcc6d3"/>
    </marker>
    <marker id="mapping-accent" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8Z" fill="#67cad5"/>
    </marker>
  </defs>
  <rect width="960" height="590" rx="12" fill="#101722"/>
  <g font-family="Arial,Helvetica,sans-serif">
    <rect x="24" y="150" width="912" height="360" rx="10" fill="none" stroke="#bcc6d3" stroke-opacity="0.6" stroke-dasharray="5 5"/>
    <text x="40" y="175" font-size="13" fill="#bcc6d3" text-anchor="start" font-weight="400" letter-spacing="1">PRIVATE WORKSPACE · REAL CUSTOMER DATA STAYS HERE</text>
    <path d="M226 284 H274" fill="none" stroke="#bcc6d3" stroke-width="1.8" marker-end="url(#mapping-arrow)"/>
    <path d="M456 284 H504" fill="none" stroke="#bcc6d3" stroke-width="1.8" marker-end="url(#mapping-arrow)"/>
    <path d="M686 284 H734" fill="none" stroke="#bcc6d3" stroke-width="1.8" marker-end="url(#mapping-arrow)"/>
    <path d="M595 336 V422 Q595 430 587 430 H373 Q365 430 365 422 V336" fill="none" stroke="#bcc6d3" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#mapping-arrow)"/>
    <rect x="402.3" y="435" width="155.39999999999998" height="25" rx="3" fill="#101722"/>
    <text x="480" y="453" font-size="16" fill="#bcc6d3" text-anchor="middle" font-weight="400" letter-spacing="0">changes requested</text>
    <text x="36" y="40" font-size="12" fill="#bcc6d3" text-anchor="start" font-weight="400" letter-spacing="1.8">ONBOARDING MAPPING ANALYST</text>
    <text x="36" y="80" font-size="29" fill="#f3f1e9" text-anchor="start" font-weight="600" letter-spacing="0">Evidence becomes canonical only after review</text>
    <text x="36" y="110" font-size="17" fill="#bcc6d3" text-anchor="start" font-weight="400" letter-spacing="0">A mapping lifecycle inside the user’s governed workspace</text>
    <g data-node-id="evidence">
      <rect data-role="bounds" x="44" y="232" width="182" height="104" rx="9" fill="#1a2636" stroke="#bcc6d3" stroke-width="1"/>
      <text x="135.0" y="263" font-size="20" fill="#f3f1e9" text-anchor="middle" font-weight="600" letter-spacing="0">Evidence</text>
      <text x="135.0" y="290" font-size="16" fill="#bcc6d3" text-anchor="middle" font-weight="400" letter-spacing="0">Salesforce +</text>
      <text x="135.0" y="313" font-size="16" fill="#bcc6d3" text-anchor="middle" font-weight="400" letter-spacing="0">Workfront</text>
    </g>
    <g data-node-id="draft">
      <rect data-role="bounds" x="274" y="232" width="182" height="104" rx="9" fill="#1a2636" stroke="#bcc6d3" stroke-width="1"/>
      <text x="365.0" y="263" font-size="20" fill="#f3f1e9" text-anchor="middle" font-weight="600" letter-spacing="0">Draft mapping</text>
      <text x="365.0" y="290" font-size="16" fill="#bcc6d3" text-anchor="middle" font-weight="400" letter-spacing="0">Claims + gaps</text>
    </g>
    <g data-node-id="review">
      <rect data-role="bounds" x="504" y="232" width="182" height="104" rx="9" fill="#1a2636" stroke="#67cad5" stroke-width="2"/>
      <text x="595.0" y="263" font-size="20" fill="#f3f1e9" text-anchor="middle" font-weight="600" letter-spacing="0">Human review</text>
      <text x="595.0" y="290" font-size="16" fill="#bcc6d3" text-anchor="middle" font-weight="400" letter-spacing="0">Compare + resolve</text>
    </g>
    <g data-node-id="approved">
      <rect data-role="bounds" x="734" y="232" width="182" height="104" rx="9" fill="#1a2636" stroke="#bcc6d3" stroke-width="1"/>
      <text x="825.0" y="263" font-size="20" fill="#f3f1e9" text-anchor="middle" font-weight="600" letter-spacing="0">Approved</text>
      <text x="825.0" y="290" font-size="16" fill="#bcc6d3" text-anchor="middle" font-weight="400" letter-spacing="0">Canonical record</text>
    </g>
    <text x="36" y="552" font-size="15" fill="#bcc6d3" text-anchor="start" font-weight="400" letter-spacing="0">Personalization changes emphasis—not source truth, approval rules, or canonical knowledge.</text>
    <text x="36" y="578" font-size="15" fill="#bcc6d3" text-anchor="start" font-weight="400" letter-spacing="0">Repository templates and examples are synthetic; the AI host owns tools and execution.</text>
  </g>
</svg>

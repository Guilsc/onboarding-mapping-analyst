<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040">
<defs>
<style>
.bg{fill:#f8fbff}.title{font:700 34px Arial,sans-serif;fill:#102b55}.sub{font:16px Arial,sans-serif;fill:#314f78}.h1{font:700 22px Arial,sans-serif;fill:#102b55}.h2{font:700 16px Arial,sans-serif;fill:#102b55}.body{font:14px Arial,sans-serif;fill:#17365d}.small{font:12px Arial,sans-serif;fill:#294a72}.tiny{font:11px Arial,sans-serif;fill:#355b82}.num{font:700 20px Arial,sans-serif;fill:#fff}.card{fill:#fff;stroke-width:1.4}.arrow{stroke:#17365d;stroke-width:2.2;fill:none;marker-end:url(#a)}.dash{stroke:#6e88a6;stroke-width:1.5;fill:none;stroke-dasharray:5 5;marker-end:url(#b)}
</style>
<marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#17365d"/></marker>
<marker id="b" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#6e88a6"/></marker>
</defs>
<rect width="1600" height="1040" class="bg"/>
<text x="800" y="42" text-anchor="middle" class="title">Onboarding Mapping Analyst (OMA)</text>
<text x="800" y="68" text-anchor="middle" class="sub">Shared governed sources, personal execution workspaces, modular skills, and optional Doppelganger personalization.</text>

<rect x="215" y="92" width="1110" height="185" rx="18" fill="#eef7ff" stroke="#2587d8" stroke-width="2"/>
<circle cx="250" cy="126" r="22" fill="#2d8de0"/><text x="250" y="133" text-anchor="middle" class="num">1</text>
<text x="290" y="122" class="h1">Personal Execution Surfaces</text><text x="290" y="145" class="body">Each user works in their own environment using OMA.</text>
<rect x="240" y="160" width="280" height="92" rx="12" class="card" stroke="#7bb7ec"/><text x="260" y="185" class="h2">Gemini (OMA Gem)</text><text x="260" y="207" class="small">• OMA behavior and instructions</text><text x="260" y="225" class="small">• Natural-language entry point</text><text x="260" y="243" class="small">• Use with selected Drive files</text>
<rect x="535" y="160" width="280" height="92" rx="12" class="card" stroke="#7bb7ec"/><text x="555" y="185" class="h2">Gemini in Google Drive</text><text x="555" y="207" class="small">• OMA Gem + Drive context</text><text x="555" y="225" class="small">• Best for live shared files</text><text x="555" y="243" class="small">• Analyze, compare, update</text>
<rect x="830" y="160" width="235" height="92" rx="12" class="card" stroke="#7bb7ec"/><text x="850" y="185" class="h2">NotebookLM</text><text x="850" y="207" class="small">• Personal analysis workspace</text><text x="850" y="225" class="small">• Best for larger source sets</text><text x="850" y="243" class="small">• Use shared files as sources</text>
<rect x="1080" y="145" width="220" height="107" rx="12" fill="#dceeff" stroke="#7bb7ec"/><text x="1100" y="172" class="h2">Individual Environment</text><text x="1100" y="194" class="small">Each user has their own</text><text x="1100" y="212" class="small">Gemini or NotebookLM.</text><text x="1100" y="230" class="small">Chats and notebooks are personal,</text><text x="1100" y="248" class="small">not shared system-of-record assets.</text>

<rect x="18" y="320" width="178" height="270" rx="14" fill="#f4f9ff" stroke="#4c9be3" stroke-width="1.8"/><text x="38" y="350" class="h2">Source Connection</text><text x="38" y="369" class="h2">Model</text><text x="38" y="398" class="small">• Behavior comes from OMA.</text><text x="38" y="425" class="small">• Evidence comes from</text><text x="50" y="443" class="small">sources selected in the</text><text x="50" y="461" class="small">current surface.</text><text x="38" y="490" class="small">• No automatic link to</text><text x="50" y="508" class="small">the entire Drive.</text><text x="50" y="526" class="small">Users select relevant</text><text x="50" y="544" class="small">sources.</text><path d="M196 455 L218 455" class="dash"/>

<rect x="220" y="305" width="1110" height="325" rx="18" fill="#f7f1ff" stroke="#8b4de8" stroke-width="2"/>
<circle cx="255" cy="342" r="22" fill="#8b4de8"/><text x="255" y="349" text-anchor="middle" class="num">2</text><text x="295" y="339" class="h1">OMA Core Behavior</text><text x="295" y="362" class="body">Onboarding Mapping Analyst (OMA)</text>
<rect x="245" y="385" width="140" height="62" rx="10" class="card" stroke="#c4a4f2"/><text x="315" y="409" text-anchor="middle" class="small">Senior Data</text><text x="315" y="427" text-anchor="middle" class="small">Systems Analyst</text><text x="315" y="443" text-anchor="middle" class="small">Identity</text>
<rect x="395" y="385" width="135" height="62" rx="10" class="card" stroke="#c4a4f2"/><text x="462" y="421" text-anchor="middle" class="small">Task Router</text>
<rect x="540" y="385" width="135" height="62" rx="10" class="card" stroke="#c4a4f2"/><text x="607" y="410" text-anchor="middle" class="small">Execution</text><text x="607" y="428" text-anchor="middle" class="small">Policy</text>
<rect x="685" y="385" width="135" height="62" rx="10" class="card" stroke="#c4a4f2"/><text x="752" y="421" text-anchor="middle" class="small">Governance</text>
<rect x="830" y="385" width="135" height="62" rx="10" class="card" stroke="#c4a4f2"/><text x="897" y="410" text-anchor="middle" class="small">Output</text><text x="897" y="428" text-anchor="middle" class="small">Standards</text>
<rect x="975" y="385" width="135" height="62" rx="10" class="card" stroke="#c4a4f2"/><text x="1042" y="410" text-anchor="middle" class="small">12 Modular</text><text x="1042" y="428" text-anchor="middle" class="small">Skills</text>
<rect x="1120" y="385" width="180" height="62" rx="10" class="card" stroke="#c4a4f2"/><text x="1210" y="410" text-anchor="middle" class="small">Doppelganger</text><text x="1210" y="428" text-anchor="middle" class="small">Policy</text>

<rect x="245" y="468" width="315" height="138" rx="12" fill="#fff" stroke="#c4a4f2"/><text x="262" y="493" class="h2">Task Intent</text><text x="350" y="493" class="small">(user request category)</text><text x="280" y="523" class="small">Analyze / Compare / Explain</text><text x="280" y="548" class="small">Generate Mapping from Intake</text><text x="280" y="573" class="small">Update Existing Mapping</text><text x="280" y="598" class="small">Discover / Build New Mapping</text>
<rect x="575" y="468" width="725" height="138" rx="12" fill="#fff" stroke="#c4a4f2"/><text x="592" y="493" class="h2">OMA decision flow</text><text x="735" y="493" class="small">(high level)</text>
<rect x="600" y="515" width="90" height="60" rx="9" fill="#e8f5ff" stroke="#54aaf2"/><text x="645" y="540" text-anchor="middle" class="small">Task</text><text x="645" y="558" text-anchor="middle" class="small">Intent</text>
<rect x="715" y="515" width="100" height="60" rx="9" fill="#e6faef" stroke="#55c984"/><text x="765" y="540" text-anchor="middle" class="small">Mapping</text><text x="765" y="558" text-anchor="middle" class="small">Workspace</text>
<rect x="840" y="515" width="105" height="60" rx="9" fill="#fff7df" stroke="#e2ac39"/><text x="892" y="540" text-anchor="middle" class="small">Complexity /</text><text x="892" y="558" text-anchor="middle" class="small">Consequence</text>
<rect x="970" y="515" width="100" height="60" rx="9" fill="#f2ebff" stroke="#9b6ee7"/><text x="1020" y="540" text-anchor="middle" class="small">Relevant</text><text x="1020" y="558" text-anchor="middle" class="small">Skills</text>
<rect x="1095" y="515" width="105" height="60" rx="9" fill="#fff0f5" stroke="#e880aa"/><text x="1147" y="540" text-anchor="middle" class="small">Doppelganger</text><text x="1147" y="558" text-anchor="middle" class="small">(optional)</text>
<rect x="1225" y="515" width="65" height="60" rx="9" fill="#e8f5ff" stroke="#54aaf2"/><text x="1257" y="549" text-anchor="middle" class="tiny">Governance</text>
<line x1="690" y1="545" x2="712" y2="545" class="arrow"/><line x1="815" y1="545" x2="837" y2="545" class="arrow"/><line x1="945" y1="545" x2="967" y2="545" class="arrow"/><line x1="1070" y1="545" x2="1092" y2="545" class="arrow"/><line x1="1200" y1="545" x2="1222" y2="545" class="arrow"/>

<rect x="1347" y="305" width="235" height="205" rx="14" fill="#effcfa" stroke="#1e9b9b" stroke-width="1.8"/><text x="1367" y="334" class="h2">Doppelganger Personalization</text><text x="1367" y="357" class="small">• No personalization (default)</text><text x="1367" y="379" class="small">• Private profile (user only)</text><text x="1367" y="401" class="small">• Import from shared path</text><text x="1367" y="423" class="small">• Optional shared lens + profile</text><text x="1367" y="445" class="small">• Never changes mapping truth</text>
<rect x="1347" y="530" width="235" height="140" rx="14" fill="#f4f9ff" stroke="#4c9be3" stroke-width="1.8"/><text x="1367" y="559" class="h2">Lens and Profile Logic</text><text x="1367" y="587" class="small">• Task may determine best-fit lens</text><text x="1367" y="611" class="small">• User preference determines profile</text><text x="1367" y="635" class="small">• Skills provide capability</text><text x="1367" y="659" class="small">• Doppelganger changes emphasis</text>

<path d="M455 277 L455 302" class="arrow"/><text x="470" y="291" class="tiny">User requests / questions / files / context</text><path d="M920 305 L920 280" class="arrow"/><text x="940" y="291" class="tiny">Responses, analysis, and outputs</text>

<rect x="220" y="680" width="1110" height="245" rx="18" fill="#edfff4" stroke="#22a55b" stroke-width="2"/>
<circle cx="255" cy="716" r="22" fill="#22a55b"/><text x="255" y="723" text-anchor="middle" class="num">3</text><text x="295" y="713" class="h1">Shared Governed Drive</text><text x="295" y="736" class="body">Trusted shared sources and governed outputs live in Drive.</text>
<rect x="245" y="758" width="510" height="145" rx="12" fill="#fff" stroke="#78d69a"/><text x="270" y="785" class="h2">Shared Mapping Workspace</text><text x="270" y="807" class="small">Source Library • Production Evidence</text><text x="270" y="829" class="small">Master Mappings: Approved / Drafts</text><text x="270" y="851" class="small">Registries • Analysis Reviews</text><text x="270" y="873" class="small">Current Approved Master Index</text><text x="270" y="895" class="small">Request Outputs (default output location)</text>
<rect x="775" y="758" width="525" height="145" rx="12" fill="#fff" stroke="#78d69a"/><text x="800" y="785" class="h2">Shared Personalization Library</text><text x="800" y="807" class="small">01 Shared Lenses</text><text x="822" y="827" class="tiny">Business Analyst • Operations • QA</text><text x="822" y="845" class="tiny">Developer / Integration • PM / DM</text><text x="800" y="870" class="small">02 Shared Profiles</text><text x="822" y="890" class="tiny">Samples • Users</text>
<path d="M455 632 L455 676" class="arrow"/><text x="473" y="651" class="tiny">Reads from governed sources (as needed)</text><path d="M920 680 L920 634" class="arrow"/><text x="938" y="651" class="tiny">Writes governed outputs (to appropriate location)</text>

<rect x="220" y="945" width="1110" height="76" rx="16" fill="#fff8e8" stroke="#f2a21b" stroke-width="2"/>
<circle cx="255" cy="983" r="22" fill="#f2a21b"/><text x="255" y="990" text-anchor="middle" class="num">4</text><text x="295" y="976" class="h1">Default Output Behavior</text><text x="295" y="999" class="small">Outputs are saved automatically based on the active workspace.</text>
<rect x="635" y="962" width="300" height="45" rx="9" fill="#fff" stroke="#f0bd61"/><text x="652" y="981" class="h2">Shared Workspace</text><text x="652" y="999" class="tiny">Shared Workspace → Request Outputs/</text>
<rect x="950" y="962" width="330" height="45" rx="9" fill="#fff" stroke="#f0bd61"/><text x="967" y="981" class="h2">Custom Workspace</text><text x="967" y="999" class="tiny">Custom Workspace → &lt;Custom Workspace&gt;/Outputs/</text>
</svg>
name: One-time purge stale Actions history

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/purge-old-runs-and-root.yml'

permissions:
  contents: write
  actions: write

jobs:
  purge-and-root:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current sanitized snapshot
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Delete prior Actions runs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs?per_page=100"

          while true; do
            data="$(curl -fsSL               -H "Authorization: Bearer ${GH_TOKEN}"               -H "Accept: application/vnd.github+json"               -H "X-GitHub-Api-Version: 2022-11-28"               "${api}")"

            ids="$(printf '%s' "${data}" | python -c 'import json, os, sys; d=json.load(sys.stdin); current=int(os.environ["GITHUB_RUN_ID"]); print(" ".join(str(r["id"]) for r in d.get("workflow_runs", []) if r["id"] != current))')"

            if [ -z "${ids}" ]; then
              break
            fi

            for id in ${ids}; do
              curl -fsSL -X DELETE                 -H "Authorization: Bearer ${GH_TOKEN}"                 -H "Accept: application/vnd.github+json"                 -H "X-GitHub-Api-Version: 2022-11-28"                 "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${id}"
            done
          done

      - name: Replace main with final clean root
        shell: bash
        run: |
          set -euo pipefail

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git checkout --orphan final-public-root
          rm -f .github/workflows/purge-old-runs-and-root.yml
          git add -A
          git commit -m 'Initial public-safe snapshot'
          git push --force origin HEAD:main

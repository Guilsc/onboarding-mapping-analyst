name: Build latest agent package

on:
  push:
    branches: [main]
    paths-ignore:
      - 'dist/**'
      - 'docs/Onboarding_Mapping_Analyst_Confluence_Solution_Guide.docx'
      - '03_Registries/Onboarding_Mapping_Agent_Knowledge_Registries.xlsx'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-latest-agent-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-latest:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          check-latest: false

      - name: Public repository safety check
        run: python scripts/public_safety_scan.py --repo

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends zip unzip pandoc librsvg2-bin
          python -m pip install --disable-pip-version-check openpyxl==3.1.5

      - name: Generate knowledge registry workbook
        run: python scripts/generate_registries.py

      - name: Render diagrams for Word
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          svgs=(docs/assets/*.svg)
          if (( ${#svgs[@]} == 0 )); then
            echo "::error::No SVG diagrams found under docs/assets."
            exit 1
          fi
          for f in "${svgs[@]}"; do
            rsvg-convert "$f" -o "${f%.svg}.png"
          done

      - name: Build Confluence Word guide
        shell: bash
        run: |
          set -euo pipefail
          cp docs/Confluence_Solution_Guide.md /tmp/Confluence_Solution_Guide.md
          sed -i 's/\.svg/\.png/g' /tmp/Confluence_Solution_Guide.md
          pandoc /tmp/Confluence_Solution_Guide.md             --from=gfm+raw_html             --resource-path=docs             -o docs/Onboarding_Mapping_Analyst_Confluence_Solution_Guide.docx

      - name: Validate generated public artifacts
        run: python scripts/public_safety_scan.py --repo

      - name: Build latest deployment ZIP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          rm -f             dist/Onboarding_Mapping_Analyst_LATEST.zip             dist/Onboarding_Mapping_Analyst_LATEST.sha256

          zip -r -q dist/Onboarding_Mapping_Analyst_LATEST.zip             00_START_HERE.md             00_Workspace             MANIFEST.md             README.md             PUBLIC_REPOSITORY_DATA_POLICY.md             01_Agent_Core             02_Skills             03_Registries             04_Source_Library             05_Production_Evidence             06_Master_Mappings             07_Analysis_Reviews             08_Interface_Setup             09_Request_Outputs             10_Personalization             docs             -x 'dist/*' '*.DS_Store'

          (
            cd dist
            sha256sum Onboarding_Mapping_Analyst_LATEST.zip               > Onboarding_Mapping_Analyst_LATEST.sha256
          )

      - name: Validate deployment package
        shell: bash
        run: |
          set -euo pipefail
          (
            cd dist
            sha256sum -c Onboarding_Mapping_Analyst_LATEST.sha256
          )
          unzip -tq dist/Onboarding_Mapping_Analyst_LATEST.zip
          python scripts/public_safety_scan.py             --package dist/Onboarding_Mapping_Analyst_LATEST.zip

      - name: Commit generated artifacts
        shell: bash
        run: |
          set -euo pipefail

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add             03_Registries/Onboarding_Mapping_Agent_Knowledge_Registries.xlsx             docs/Onboarding_Mapping_Analyst_Confluence_Solution_Guide.docx             dist/Onboarding_Mapping_Analyst_LATEST.zip             dist/Onboarding_Mapping_Analyst_LATEST.sha256

          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
            exit 0
          fi

          git commit -m 'chore: refresh generated agent package [skip ci]'
          git push
